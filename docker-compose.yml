services:
  mysql:
    image: mysql:8.4
    container_name: tapeory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tapeory}
      MYSQL_USER: ${MYSQL_USER:-tapeory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tapeory

  api:
    # `docker compose pull` fetches the prebuilt image; `docker compose up -d --build` builds it
    # from this checkout instead.
    image: ${TAPEORY_IMAGE:-ghcr.io/tunefish92/tapeory:latest}
    build:
      context: .
      dockerfile: Tapeory.Api/Dockerfile
    container_name: tapeory-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # No connection string here: on first start the web UI asks for it (server "mysql",
      # port 3306, and the MYSQL_* values from .env) and saves it to /data/config/database.json.
      TAPEORY_STORAGE_PATH: /data
      TAPEORY_AUTO_MIGRATE: ${TAPEORY_AUTO_MIGRATE:-true}
      # Owner of the storage folder on the host; the app runs as this user.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "${TAPEORY_PORT:-8080}:8080"
    volumes:
      - ${TAPEORY_STORAGE_HOST_PATH:-./tapeory-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tapeory

volumes:
  mysql-data:

networks:
  tapeory:
