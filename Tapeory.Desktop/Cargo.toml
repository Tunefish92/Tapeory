[package]
name = "tapeory-desktop"
version = "0.4.0"
edition = "2024"
description = "Tapeory as a desktop app: an egui interface on top of Tapeory's engine."
license = "MIT"
publish = false

[[bin]]
name = "tapeory"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
# The font parser egui uses, to check font files before handing them over (it panics on bad ones).
ab_glyph = "0.2.32"
egui_extras = { version = "0.32", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "cookies", "rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
